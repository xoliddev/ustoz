name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit + DB + API tests (PGlite and PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ustoz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # every DB/API suite runs on PGlite and, with this set, on real PostgreSQL 16 as well
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ustoz_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (core, i18n, payments, contract, bot engine, seed, web)
        run: npx vitest run --project core --project i18n --project payments --project contract --project botkit --project seed --project web
      # the DB, API and bot suites each reset the shared Postgres schema, so they run one after another
      - name: DB tests (PGlite + Postgres 16)
        run: npx vitest run --project db
      - name: API tests (PGlite + Postgres 16)
        run: npx vitest run --project api
      - name: Bot adapter tests
        run: npx vitest run --project bot

  e2e:
    name: Playwright (1440 px + 375 px)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:demo
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image boots against PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ustoz
          POSTGRES_PASSWORD: ustoz
          POSTGRES_DB: ustoz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ustoz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t ustoz-api .
      - name: Run and probe /healthz
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgres://ustoz:ustoz@localhost:5432/ustoz \
            -e JWT_SECRET=ci-only-jwt-secret-0123456789abcdef0123 \
            -e CERT_SECRET=ci-only-cert-secret-0123456789abcdef012 \
            ustoz-api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4182/healthz; then echo; docker logs api | tail -5; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
